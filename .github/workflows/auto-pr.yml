# =============================================================
# auto-pr.yml — feat/** 브랜치 push 시 PR 자동 생성/갱신
#
# 동작:
#   1) feat/** 브랜치에 push 되면 실행
#   2) 해당 브랜치의 PR이 없으면 Draft PR 자동 생성
#      - 제목: 마지막 커밋 메시지 (hj-day2: 한글요약 형식)
#      - 본문: 커밋 목록 자동 채움 + PR 템플릿 구조 유지
#   3) PR이 이미 있으면 커밋 목록 섹션만 갱신
# =============================================================
name: PR 자동 생성/갱신

on:
  push:
    branches:
      - "feat/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR 제목·본문 생성 및 PR 생성/갱신
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"

          # ── Day 추출 (feat/hj-day2 → 2) ──────────────────────
          DAY_NUM=$(echo "$BRANCH" | grep -oE 'day[0-9]+' | grep -oE '[0-9]+' || echo "?")

          # ── PR 제목: 마지막 커밋 메시지 첫 줄 ────────────────
          PR_TITLE=$(git log -1 --format="%s")

          # ── main 대비 커밋 목록 ───────────────────────────────
          COMMIT_LIST=$(git log origin/main..HEAD --format="- %s" --reverse)
          if [ -z "$COMMIT_LIST" ]; then
            COMMIT_LIST="- (커밋 없음)"
          fi

          # ── PR 본문 생성 (heredoc 없이 파일로 작성) ──────────
          BODY_FILE=$(mktemp)
          {
            echo "## 📋 작업 정보"
            echo ""
            echo "**Day**: Day ${DAY_NUM}"
            echo ""
            echo "**역할** (하나만 체크):"
            echo "- [ ] HJ — 시스템·메타·인프라"
            echo "- [ ] CS — timeseries"
            echo "- [ ] NY — anomaly"
            echo "- [ ] jh — tabular"
            echo ""
            echo "**브랜치**: \`${BRANCH}\` → \`main\`"
            echo ""
            echo "---"
            echo ""
            echo "## 🎯 변경 요약"
            echo ""
            echo "<!-- 이 PR에서 한 일을 2~3줄로 직접 작성해주세요 -->"
            echo ""
            echo "-"
            echo "-"
            echo ""
            echo "---"
            echo ""
            echo "## 📝 커밋 목록 (자동 생성)"
            echo ""
            echo "${COMMIT_LIST}"
            echo ""
            echo "---"
            echo ""
            echo "## ✅ DoD 체크리스트"
            echo ""
            echo "> \`TEAM_10DAY_SCHEDULE.md\` 의 해당 Day · 본인 역할 행을 복붙하여 체크"
            echo ""
            echo "- [ ]"
            echo "- [ ]"
            echo ""
            echo "---"
            echo ""
            echo "## 🛡️ 영역 자가 검증 (필수)"
            echo ""
            echo "\`\`\`bash"
            echo "git diff --stat origin/main..HEAD"
            echo "\`\`\`"
            echo ""
            echo "- [ ] 본인 영역만 수정됨 ✅"
            echo "- [ ] 공유 파일 수정 있음 ⚠️ — 사유:"
            echo ""
            echo "---"
            echo ""
            echo "## 🧪 테스트 결과"
            echo ""
            echo "- [ ] \`pytest tests/handlers/{본인카테고리}/ -q\` 그린"
            echo "- [ ] \`pytest tests/ -q\` 그린"
            echo "- [ ] \`ruff check {본인영역}/\` 그린"
            echo ""
            echo "---"
            echo ""
            echo "## 🤝 Contract Day 여부"
            echo ""
            echo "- [ ] **Day 4** — Guardrails 강화"
            echo "- [ ] **Day 6** — \`state.best_params\` 추가"
            echo "- [ ] **Day 8** — InsightAgent 가드레일"
            echo "- [ ] **Day 9** — \`outputs/base.py\` 훅 시그니처"
            echo ""
            echo "---"
            echo ""
            echo "## 🔗 관련 (선택)"
            echo ""
            echo "- 이슈 / 티켓:"
            echo "- 관련 PR:"
            echo ""
            echo "---"
            echo ""
            echo "> 🤖 이 PR은 push 시 자동 생성되었습니다. 위 내용을 검토 후 제출해주세요."
          } > "$BODY_FILE"

          # ── 기존 PR 존재 여부 확인 ───────────────────────────
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then
            # PR 없음 → Draft PR 신규 생성
            gh pr create \
              --title "$PR_TITLE" \
              --body-file "$BODY_FILE" \
              --base main \
              --head "$BRANCH" \
              --draft
            echo "✅ Draft PR 생성: ${PR_TITLE}"
          else
            # PR 있음 → 제목 + 본문 전체 갱신 (커밋 목록 최신화)
            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body-file "$BODY_FILE"
            echo "✅ PR #${EXISTING_PR} 갱신: ${PR_TITLE}"
          fi

          rm -f "$BODY_FILE"
