# =============================================================
# CI  -  Lint + Test (PR 및 모든 브랜치 push 시 실행)
# 빠른 피드백 목적이라 Docker 빌드는 deploy.yml 에서만 수행
# =============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ada
          POSTGRES_PASSWORD: ada
          POSTGRES_DB: ada_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ada"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/api.txt
          # smoke test 용 최소 데이터 라이브러리 (worker.txt 전체는 torch 때문에 무거움)
          pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.0
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        env:
          DATABASE_URL: postgresql://ada:ada@localhost:5432/ada_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test
        run: pytest -q --cov=. --cov-report=term-missing

  docker-build-check:
    # PR 단계에서 Dockerfile 문법/빌드 가능 여부만 검증 (push 는 안 함)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20
    strategy:
      matrix:
        image:
          - { name: api,      file: docker/Dockerfile.api }
          - { name: frontend, file: docker/Dockerfile.frontend }
          - { name: worker,   file: docker/Dockerfile.worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image.name }} (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
