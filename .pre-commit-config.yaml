# ============================================================
# ADA v2 — pre-commit 훅 (클라이언트측 가드)
# ============================================================
# 매 git commit 시 자동 실행되어 영역 위반/포매팅 오류를 차단.
# post-merge 훅: git pull 완료 시 테스트 의존성 자동 동기화.
#
# 최초 1회 설치:
#   pip install pre-commit
#   pre-commit install          ← pre-commit + post-merge 훅 모두 설치됨
#
# 수동 실행:
#   pre-commit run --all-files
#
# 우회 (긴급시만, HJ 협의 필수):
#   git commit --no-verify
#
# ── Windows Smart App Control(WinError 4551) 회피 ──
# pre-commit 이 만드는 서명 없는 console-script launcher(.exe) 를
# Windows 애플리케이션 제어 정책(SAC/WDAC)이 멀티프로세스 동시 spawn 시
# 일관되게 차단한다("[WinError 4551] 애플리케이션 제어 정책에서 이 파일을 차단했습니다").
# 그래서 pre-commit-hooks 외부 repo 대신 local + `python -m <module>` 진입으로
# 실행한다 — 서명된 python.exe 로 모듈을 직접 호출해 launcher 를 우회한다.
# (ruff 는 단일 Rust 바이너리라 launcher 가 없어 영향 없음 → 외부 repo 유지.)
#
# 수정 권한: HJ 단독 (.github/CODEOWNERS 참조)
# ============================================================

# pre-commit install 한 번으로 아래 훅 타입 모두 자동 설치
default_install_hook_types: [pre-commit, post-merge]

repos:
  # ─────────────────────────────────────────────────────────
  # 1) Ruff — lint + format 자동 수정 (단일 바이너리, SAC 영향 없음)
  # ─────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ─────────────────────────────────────────────────────────
  # 2) 기본 위생 훅 — pre-commit-hooks(v5.0.0) 를 local + `python -m`
  #    진입으로 실행 (위 헤더의 WinError 4551 회피 설명 참조).
  #    8개 훅이 동일 additional_dependencies 로 venv 하나를 공유한다.
  # ─────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
        types: [text]
        stages: [pre-commit]

      - id: end-of-file-fixer
        name: fix end of files
        entry: python -m pre_commit_hooks.end_of_file_fixer
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
        types: [text]
        stages: [pre-commit]

      - id: check-yaml
        name: check yaml
        entry: python -m pre_commit_hooks.check_yaml
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
        types: [yaml]
        exclude: ^(docker/.*\.yml|\.github/workflows/.*\.yml)$  # Helm/GHA template 제외
        stages: [pre-commit]

      - id: check-json
        name: check json
        entry: python -m pre_commit_hooks.check_json
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
        types: [json]
        stages: [pre-commit]

      - id: check-toml
        name: check toml
        entry: python -m pre_commit_hooks.check_toml
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
        types: [toml]
        stages: [pre-commit]

      - id: check-added-large-files
        name: check for added large files
        entry: python -m pre_commit_hooks.check_added_large_files
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
        args: [--maxkb=1024]
        stages: [pre-commit]

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: python -m pre_commit_hooks.check_merge_conflict
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
        types: [text]
        stages: [pre-commit]

      - id: detect-private-key
        name: detect private key
        entry: python -m pre_commit_hooks.detect_private_key
        language: python
        additional_dependencies: ["pre-commit-hooks==5.0.0"]
        types: [text]
        stages: [pre-commit]
      # mixed-line-ending 훅 제거 — Windows core.autocrlf=true 환경에서
      # Python 캐시 실행파일이 AppControl에 차단됨 (WinError 4551).
      # LF 강제 적용은 .gitattributes eol=lf + CI (Linux) 에서 보장.

  # ─────────────────────────────────────────────────────────
  # 3) 본인 영역 외 수정 차단 (ADA 특화)
  # ─────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: scope-check
        name: "본인 영역 외 수정 차단 (CODEOWNERS 동기)"
        entry: bash scripts/dev/check_scope.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        # 우회: git commit --no-verify (HJ 협의 필수)

      - id: shared-deps-warning
        name: "공유 의존성 파일 수정 경고"
        entry: bash scripts/dev/check_shared_deps.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        # 경고만 (exit 0). 차단은 CODEOWNERS 가 PR 단계에서 강제.
        # 인라인 bash -c '...' 는 Windows entry 파싱과 충돌(괄호 syntax error)하여
        # 스크립트 파일로 분리함.

      - id: ensure-post-merge-hook
        name: "post-merge 훅 자동 설치 확인"
        entry: bash -c 'if [ ! -f .git/hooks/post-merge ]; then pre-commit install --hook-type post-merge 2>/dev/null && echo "✅ post-merge 훅 설치됨 (이후 git pull 마다 자동 동기화)"; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

      - id: sync-test-deps
        name: "git pull 후 테스트 의존성 자동 동기화"
        entry: bash -c 'PYTHONUTF8=1 pip install -q --upgrade-strategy only-if-needed -r requirements/test.txt && echo "✅ 의존성 동기화 완료"'
        language: system
        pass_filenames: false
        stages: [post-merge]
        always_run: true
