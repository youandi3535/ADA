# ============================================================
# Alembic configuration (Day01 v2.2 sec.3 - Day02 migration baseline)
# DATABASE_URL env var used as-is (no code-pinned URL, per R-001)
# ASCII-only: alembic on Windows reads this file with locale (cp949)
# encoding by default. Korean text causes UnicodeDecodeError on
# `alembic upgrade` etc. Set PYTHONUTF8=1 if non-ASCII is needed.
# ============================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@host/dbname

# Env var interpolation handled in migrations/env.py

[post_write_hooks]
# Auto-format migrations (optional)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
