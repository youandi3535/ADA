# ============================================================
# Alembic configuration  (Day01 v2.2 §3 — Day02 마이그레이션 베이스라인)
# 환경변수 DATABASE_URL 을 그대로 사용 → 코드 핀 없음 (R-001)
# ============================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@host/dbname

# 환경변수 인터폴레이션은 migrations/env.py 에서 처리

[post_write_hooks]
# 마이그레이션 자동 포맷 (옵션)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
