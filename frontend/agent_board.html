<style>
html,body{margin:0;background:#070a1f;}
.cwrap{font-family:'Pretendard','Inter',system-ui,-apple-system,sans-serif;max-width:980px;margin:0 auto;color:#e6eeff;}
.cboard{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 16px;border:1px solid rgba(130,150,255,.22);background:radial-gradient(130% 120% at 50% 0%,#1a1146 0%,#0b1030 42%,#070a1f 100%);box-shadow:0 26px 80px rgba(8,6,30,.6);}
.ctitle{font-size:1.18rem;font-weight:800;color:#f0f3ff;display:flex;align-items:center;gap:10px;}
.cmuted{color:#8a7fff;font-weight:800;}
.cdot{width:10px;height:10px;border-radius:50%;background:#5ce0ff;box-shadow:0 0 12px #5ce0ff;animation:cd 1.6s infinite;}

.csub{color:#9aa0d6;font-size:.84rem;margin-top:6px;}
.csub b{color:#c7c2ff;}
.cchips{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 2px;}
.cchip{font-size:.73rem;font-weight:700;color:#c9d0ff;background:rgba(130,150,255,.12);border:1px solid rgba(130,150,255,.2);padding:5px 11px;border-radius:999px;}
.cchip.gold{color:#e9cf96;background:rgba(232,201,132,.12);border-color:rgba(232,201,132,.26);}
.cchip.ok{color:#8ff0c8;background:rgba(61,232,154,.12);border-color:rgba(61,232,154,.26);}
#cstage{width:100%;}
#cstage svg{width:100%;height:auto;display:block;}
.ccap{display:flex;flex-direction:column;gap:2px;min-height:42px;padding:6px 4px 0;}
#ccapMain{font-size:.98rem;font-weight:800;color:#f0f3ff;}
#ccapFlow{font-size:.8rem;color:#7cc0ff;font-weight:600;min-height:16px;}
.cleg{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:6px;padding-top:10px;border-top:1px dashed rgba(130,150,255,.2);}
.clg{display:flex;align-items:center;gap:6px;font-size:.71rem;color:#a6acdd;font-weight:600;}
.clg i{width:11px;height:11px;border-radius:50%;display:inline-block;}
.orbit{transition:opacity .6s;}
.orbit.dim{opacity:.12;}
.seg{fill:none;stroke:rgba(150,170,255,.16);stroke-width:2;}
.seg.seg-done{stroke:rgba(124,200,255,.5);}
.seg.seg-on{stroke:#7cf3ff;stroke-width:3;filter:drop-shadow(0 0 5px rgba(124,243,255,.7));}
.spoke{stroke-width:1;opacity:.1;}
.chord{fill:none;}
.node-on .ohalo{opacity:.85;animation:oh 1.1s ease-out infinite;}
@keyframes oh{0%{opacity:.85;r:15}70%{opacity:0;r:30}100%{opacity:0}}
.node-on .ocore{r:9;}
.node-err .ocore{fill:#ff7a7a !important;}
.orb-l{fill:#cfd8ff;font-size:11px;font-weight:700;dominant-baseline:middle;}
.gateMk{font-size:10px;animation:gmk 2.4s ease-in-out infinite;}
@keyframes gmk{0%,100%{opacity:.5}50%{opacity:1}}
.rllbl{fill:#f3ab94;font-size:11px;font-weight:700;letter-spacing:1.2px;opacity:0;transition:opacity .4s;text-anchor:middle;}
.ovwrap{transition:opacity .5s;}
.dwrap{opacity:0;pointer-events:none;transition:opacity .6s;}
.dwrap.show{opacity:1;}
.dvHead{fill:#e8c984;font-size:13px;font-weight:800;letter-spacing:3px;text-anchor:middle;}
.dvSub{fill:#cdb78a;font-size:10.5px;text-anchor:middle;}
.dcard{opacity:0;transform:translateY(26px);transition:opacity .55s ease,transform .6s cubic-bezier(.2,.85,.25,1);}
.dcard.in{opacity:1;transform:translateY(0);}
</style>

    if(cur===13&&!loopedM&&Math.random()<0.62){loopedM=true;bumpRetry();beamSeg(chordD(13,6),6,'기준선 미달 — 재학습','지표 집계 ↺ 전처리 전략 · 4단계 재학습');return;}
    if(cur===15&&!loopedE&&Math.random()<0.72){loopedE=true;bumpRetry();beamSeg(chordD(15,10),10,'성능 미달 — 재학습','평가 ↺ 하이퍼튜닝 · 5단계 재학습');return;}
    if(cur===21){clearSeg();startSeg(finalPath,finalLen,-1,'fin');return;}
    clearSeg();forwardSeg[cur].path.classList.add('seg-on');startSeg(forwardSeg[cur].path,forwardSeg[cur].len,cur+1,'fwd');
  }
  function arrive(to,from){
    if(from!=null&&from>=0){orbEl[from].classList.remove('node-on');}
    orbEl[to].classList.add('node-on');
    var a=ORD[to];
    if(a[2]==='gate'){capM.textContent='👤 사용자와 합의 · '+a[1];showGate(to);}
    else capM.textContent='진행 중 · '+a[1];
    capF.textContent= (from!=null&&from>=0)?(ORD[from][1]+'   →   '+a[1]):'코어 → 파이프라인 시작';
    if(guardSet[to])flashGuard();
    if(from>=0&&a[2]!=='gate'&&!dartS.active&&Math.random()<0.1)spawnDart(to);
  }
  function completeCycle(){clearSeg();capM.textContent='✓ 분석 완료 — 산출물 5종 생성 완료';capF.textContent='PPTX · PDF · HTML 대시보드 · 분석 스크립트 · 인사이트 노트';ov.style.opacity=0;orbit.classList.add('dim');dwrap.classList.add('show');cards.forEach(function(c,i){setTimeout(function(){c.classList.add('in');},170*i);});phase='done';pauseUntil=performance.now()+3600;}
  function reset(){phase='run';orbit.classList.remove('dim');ov.style.opacity=1;dwrap.classList.remove('show');cards.forEach(function(c){c.classList.remove('in');});orbEl.forEach(function(o){o.classList.remove('node-on','node-err');});forwardSeg.forEach(function(f){f.path.classList.remove('seg-on','seg-done');});[].forEach.call(document.getElementById('cchord').querySelectorAll('path[stroke="'+GC.rl+'"]'),function(e){e.parentNode.removeChild(e);});activeBeam=null;rllbl.setAttribute('opacity',0);loopedM=false;loopedE=false;retry=0;retryChip.textContent='↺ 재학습 0회';cur=0;arrive(0,-1);go();capM.textContent='새 작업 수신 · 코어 가동';}
  function frame(now){
    requestAnimationFrame(frame);
    ambAng+=AMB;for(var j=0;j<amb.length;j++){var pp=pos(ambAng*57.3+j*60,R);amb[j].setAttribute('cx',pp.x);amb[j].setAttribute('cy',pp.y);}
    if(dartS.active){var dk=(now-dartS.t0)/1000;if(dk>=1){dartS.active=false;dart.setAttribute('opacity',0);orbEl[dartS.i].classList.remove('node-err');}else{var kk=dk<.5?dk/.5:(1-(dk-.5)/.5);dart.setAttribute('transform','translate('+(dartS.fx+(dartS.tx-dartS.fx)*kk)+','+(dartS.fy+(dartS.ty-dartS.fy)*kk)+')');dart.setAttribute('opacity',1);}}
    if(phase==='done'){if(now>=pauseUntil)reset();return;}
    if(cometPt){var _t=Math.atan2(cometPt.y-C.y,cometPt.x-C.x)*180/Math.PI;var _d=_t-sweepAng;while(_d>180)_d-=360;while(_d<-180)_d+=360;sweepAng+=_d*0.22;wg.setAttribute('transform','rotate('+(sweepAng-22)+' '+C.x+' '+C.y+')');}
    if(!curPath)return;
    prog+=SPEED;
    if(activeBeam)activeBeam.setAttribute('stroke-dashoffset',Math.max(0,curLen-prog));
    if(prog>=curLen){
      if(curMode==='fwd'){forwardSeg[cur].path.classList.remove('seg-on');forwardSeg[cur].path.classList.add('seg-done');}
      if(curMode==='fin'){completeCycle();return;}
      if(curMode==='beam')fadeBeam();
      var to=curTo;arrive(to,cur);cur=to;go();return;
    }
    var p=curPath.getPointAtLength(prog);cometPt=p;trail[0].setAttribute('transform','translate('+p.x+','+p.y+')');
    for(var q=1;q<trail.length;q++){var pq=curPath.getPointAtLength(Math.max(0,prog-q*8));trail[q].setAttribute('transform','translate('+pq.x+','+pq.y+')');}
  }
  arrive(0,-1);go();cometPt=pos(angOf(0),R);
  requestAnimationFrame(frame);
})();
</script>
