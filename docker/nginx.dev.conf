# ============================================================
# nginx.dev.conf  -  로컬 개발 전용 (HTTP only, SSL 없음)
# 프로덕션은 nginx.conf (HTTPS + Let's Encrypt) 사용
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    client_max_body_size 110m;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1024;

    upstream ada_api      { server api:8000; }
    upstream ada_frontend { server frontend:8501; }
    upstream ada_mlflow   { server mlflow:5000; }

    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            proxy_pass         http://ada_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_read_timeout 1h;
        }

        location /mlflow/ {
            proxy_pass         http://ada_mlflow/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass         http://ada_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 1h;
        }

        location = /healthz { return 200 "ok\n"; access_log off; }
    }
}
