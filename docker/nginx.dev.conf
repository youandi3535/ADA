# ============================================================
# nginx.dev.conf  -  로컬 개발 전용 (HTTP only, SSL 없음)
# 프로덕션은 nginx.conf (HTTPS + Let's Encrypt) 사용
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    client_max_body_size 110m;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1024;

    # Docker 내장 DNS — 컨테이너 재생성 시 새 IP 동적 재해석 (stale upstream 502 방지).
    # 정적 upstream 블록은 기동 시 1회만 해석·캐시하므로 api/frontend 재생성 후 502 발생 →
    # proxy_pass 변수화로 매 요청마다 127.0.0.11 로 재해석. (prod nginx.conf 와 동일 패턴)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            set $upstream_api api;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://$upstream_api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_read_timeout 1h;
        }

        location /mlflow/ {
            set $upstream_mlflow mlflow;
            rewrite ^/mlflow/(.*)$ /$1 break;
            proxy_pass         http://$upstream_mlflow:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location / {
            set $upstream_frontend frontend;
            proxy_pass         http://$upstream_frontend:8501;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 1h;
        }

        location = /healthz { return 200 "ok\n"; access_log off; }
    }
}
