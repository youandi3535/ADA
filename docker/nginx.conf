# ============================================================
# nginx.conf  -  ADA 리버스 프록시
# 80: api(/api → :8000) + frontend(/ → :8501) + mlflow(/mlflow → :5000)
# 443: Day17 TLS 발급 후 활성화 (compose 의 ports 주석 해제 + 인증서 마운트)
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 업로드 한도 (Streamlit MAX_UPLOAD_SIZE_MB=100 과 일치)
    client_max_body_size 110m;

    # gzip
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1024;

    # 업스트림
    upstream ada_api      { server api:8000; }
    upstream ada_frontend { server frontend:8501; }
    upstream ada_mlflow   { server mlflow:5000; }

    server {
        listen 80 default_server;
        server_name _;

        # ----- API -----
        location /api/ {
            proxy_pass         http://ada_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # SSE / WebSocket
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_read_timeout 1h;
        }

        # ----- MLflow UI -----
        location /mlflow/ {
            proxy_pass         http://ada_mlflow/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ----- Streamlit Frontend (루트) -----
        location / {
            proxy_pass         http://ada_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Streamlit WebSocket
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 1h;
        }

        # 헬스체크
        location = /healthz { return 200 "ok\n"; access_log off; }
    }
}
