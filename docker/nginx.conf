# ============================================================
# nginx.conf  -  ADA 리버스 프록시
# 80: HTTPS 리다이렉트
# 443: TLS + api/frontend/mlflow 프록시
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 업로드 한도 (Streamlit MAX_UPLOAD_SIZE_MB=100 과 일치)
    client_max_body_size 110m;

    # gzip
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1024;

    # 업스트림
    upstream ada_api      { server api:8000; }
    upstream ada_frontend { server frontend:8501; }
    upstream ada_mlflow   { server mlflow:5000; }

    # HTTP → HTTPS 리다이렉트
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name ada-aiagent.com;

        ssl_certificate     /etc/letsencrypt/live/ada-aiagent.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ada-aiagent.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ----- API -----
        location /api/ {
            proxy_pass         http://ada_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_read_timeout 1h;
        }

        # ----- MLflow UI -----
        location /mlflow/ {
            proxy_pass         http://ada_mlflow/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ----- Streamlit Frontend (루트) -----
        location / {
            proxy_pass         http://ada_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 1h;
        }

        # 헬스체크
        location = /healthz { return 200 "ok\n"; access_log off; }
    }
}
