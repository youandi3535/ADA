# ============================================================
# nginx.conf  -  ADA 리버스 프록시
# 80: HTTPS 리다이렉트
# 443: TLS + api/frontend/mlflow 프록시
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 업로드 한도 (Streamlit MAX_UPLOAD_SIZE_MB=100 과 일치)
    client_max_body_size 110m;

    # gzip
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1024;

    # Docker 내장 DNS resolver.
    # 정적 upstream 블록은 nginx 기동 시 1회만 호스트명을 IP 로 해석·캐시하므로,
    # api/frontend/mlflow 컨테이너가 재생성되어 새 IP 를 받으면 nginx 가 옛 IP 로
    # 프록시하다 connect 실패 → 502(stale upstream) 가 발생한다.
    # → proxy_pass 에 변수를 써서 매 요청마다 127.0.0.11(Docker DNS)로 재해석하게 하면
    #   컨테이너 재생성 후에도 valid 캐시(10s) 내에 새 IP 를 자동으로 따라간다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # HTTP → HTTPS 리다이렉트
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name ada-aiagent.com;

        ssl_certificate     /etc/letsencrypt/live/ada-aiagent.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ada-aiagent.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ----- API -----
        # 변수 proxy_pass → 매 요청마다 resolver 로 'api' 재해석 (stale IP 502 방지).
        # 변수 사용 시 location 기반 자동 prefix-strip 이 동작하지 않으므로 rewrite 로 /api 제거.
        location /api/ {
            set $upstream_api api;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://$upstream_api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_read_timeout 1h;
        }

        # ----- MLflow UI -----
        location /mlflow/ {
            set $upstream_mlflow mlflow;
            rewrite ^/mlflow/(.*)$ /$1 break;
            proxy_pass         http://$upstream_mlflow:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ----- Streamlit Frontend (루트) -----
        location / {
            set $upstream_frontend frontend;
            proxy_pass         http://$upstream_frontend:8501;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 1h;
        }

        # 헬스체크
        location = /healthz { return 200 "ok\n"; access_log off; }
    }
}
